racecar_simulator:
  ros__parameters:
    # General parameters
    simulator_frequency: 200.0          # Hz
    odom_frequency: 50.0                # Hz
    imu_frequency: 100.0                # Hz
    scan_frequency: 40.0                # Hz
    scan_beams: 1080                    # number of beams in the lidar scan
    scan_field_of_view: 4.71238898      # rad (270 deg)
    scan_std_dev: 0.01                  # m (scan noise std dev)
    map_free_threshold: 0.2             # m
    detect_car_mode: false              # detect other cars
    state_noise_mode: false             # add noise to the state
    scan_noise_mode: false              # add noise to the scan

    # Topics & frames (car0)
    drive_topic0: "ackermann_cmd0"
    state_topic0: "state0"
    scan_topic0: "scan0"
    collision_topic0: "collision0"
    odom_topic0: "odom0"
    imu_topic0: "imu0"
    pose_topic0: "pose0"
    base_frame0: "base_link0"
    scan_frame0: "laser_model0"

    # Vehicle parameters (car0) — from C++ defaults
    mass0: 5.1                          # kg
    l_r0: 0.1560                         # m  CoM -> rear axle
    l_f0: 0.1740                         # m  CoM -> front axle
    I_z0: 0.3293                          # kg*m^2 yaw inertia

    # Tire/friction model (C++ names)
    B_f0: 2.8258
    C_f0: 0.8576
    D_f0: 1.1255
    B_r0: 8.2936
    C_r0: 1.1897
    D_r0: 0.9068
    long_B0: 2.3348
    long_C0: 1.3535
    long_mu_tire0: 0.6544

    # Drivetrain & motor (car0)
    wheel_radius0: 0.05                 # m
    motor_torque_constant0: 0.3910     # N*m/A
    power_train_inertia0: 0.1117        # kg*m^2 
    coulomb_friction0: 2.1570           # N*m (b1)
    viscous_friction0: 0.4323           # N*m*s/rad (b0)

    # Aerodynamic drag
    Cd0_0: 0.0033                          # N
    Cd1_0: 0.0005                         # N/(m/s)
    Cd2_0: 0.0019                          # N/(m/s)^2

    # PID controller parameters (car0)
    motor_p: 15.0
    motor_i: 0.1
    motor_d: 0.01
    
